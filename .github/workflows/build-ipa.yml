name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    paths-ignore: ["**.md", "rec/**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - name: Unit tests
        run: |
          xcodebuild test -project Vinyl.xcodeproj -scheme Vinyl             -destination 'platform=iOS Simulator,name=iPhone 18 Pro Max' CODE_SIGNING_ALLOWED=NO
      - name: Build
        run: |
          xcodebuild -project Vinyl.xcodeproj -scheme Vinyl -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Vinyl.app Payload/
          ls Payload/Vinyl.app/PlugIns
          zip -qr Vinyl.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Vinyl-ipa, path: Vinyl.ipa }
