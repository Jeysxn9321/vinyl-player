name: Simulator screenshots
on: [workflow_dispatch]
jobs:
  shots:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - name: Build for simulator
        run: |
          xcodebuild -project Vinyl.xcodeproj -scheme Vinyl -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run and capture
        run: |
          mkdir -p shots
          # iPhone Duo has two displays; simctl refuses to guess, so capture both (1 = main, 3 = second).
          snap() {
            if echo "$NAME" | grep -q Duo; then
              xcrun simctl io "$UDID" screenshot --display=1 "${1%.png}_d1.png" || true
              xcrun simctl io "$UDID" screenshot --display=3 "${1%.png}_d3.png" || true
            else xcrun simctl io "$UDID" screenshot "$1"; fi
          }
          xcrun simctl list devices available | grep -E "iPhone 18 Pro Max|iPad Pro|Duo"
          for NAME in "iPhone 18 Pro Max" "iPad Pro 13-inch (M5)" "iPhone Duo"; do
            UDID=$(xcrun simctl list devices available | grep "$NAME (" | head -1 | grep -oE '[0-9A-F-]{36}')
            [ -z "$UDID" ] && { echo "no $NAME"; continue; }
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Vinyl.app
            xcrun simctl launch "$UDID" com.example.vinyl
            sleep 4; snap "shots/$(echo $NAME | tr -c 'A-Za-z0-9' _)_onboarding.png"
            xcrun simctl terminate "$UDID" com.example.vinyl
            xcrun simctl launch "$UDID" com.example.vinyl -demo
            sleep 5; snap "shots/$(echo $NAME | tr -c 'A-Za-z0-9' _)_player.png"
            xcrun simctl terminate "$UDID" com.example.vinyl
            xcrun simctl launch "$UDID" com.example.vinyl -demo -landscape
            sleep 6; snap "shots/$(echo $NAME | tr -c 'A-Za-z0-9' _)_landscape.png"
            xcrun simctl terminate "$UDID" com.example.vinyl
            TAG=$(echo $NAME | tr -c 'A-Za-z0-9' _)
            shot() { xcrun simctl launch "$UDID" com.example.vinyl -demo "${@:2}"; sleep 5; snap "shots/${TAG}_$1.png"; xcrun simctl terminate "$UDID" com.example.vinyl; }
            shot hidden -hidden
            shot pill -pill -hidden
            shot settings -settings
            shot browser -browser
            shot queue -queue
            shot artwork -artwork
            if echo "$NAME" | grep -q "iPhone 18"; then
              shot pat_splatter -vinylPattern splatter -vinylColor red -fxSheen YES
              shot pat_marble -vinylPattern marble -vinylColor blue -fxGlow YES
              shot pat_swirl_dust -vinylPattern swirl -vinylColor gold -fxDust YES
              shot theme_ember -appTheme ember -vinylColor black
              shot theme_ocean_settings -appTheme ocean -settings
              shot label_text_large -labelStyle text -labelSize large -vinylColor red
              shot label_solid_small -labelStyle solid -labelSize small -vinylColor blue
              shot am_library -ambrowser
              shot sp_tracks -browser -ptracks
              shot sp_search -browser -pquery neon
              shot am_tracks -ambrowser -amtracks
              shot am_search -ambrowser -amquery neon
              xcrun simctl launch "$UDID" com.example.vinyl -widget; sleep 5; snap "shots/${TAG}_widget.png"; xcrun simctl terminate "$UDID" com.example.vinyl
              xcrun simctl launch "$UDID" com.example.vinyl -card; sleep 5; snap "shots/${TAG}_card.png"; xcrun simctl terminate "$UDID" com.example.vinyl
            fi
            if echo "$NAME" | grep -q iPad; then
              shot duo_unfolded_740x540 -frame 740x540
              shot duo_portrait_800x1000 -frame 800x1000
              shot duo_outer_700x400 -frame 700x400
            fi
            xcrun simctl shutdown "$UDID"
          done
          ls shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots }
