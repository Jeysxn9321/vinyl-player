name: Vinyl
options: { bundleIdPrefix: com.example, deploymentTarget: { iOS: "17.0" } }
targets:
  Vinyl:
    type: application
    platform: iOS
    sources: [Vinyl, Shared]
    dependencies:
      - target: LunaraWidgets
    info:
      path: Vinyl/Info.plist
      properties:
        CFBundleDisplayName: Lunara
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppleMusicUsageDescription: Vinyl shows and controls your Apple Music playback.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [vinylplayer]
        LSApplicationQueriesSchemes: [spotify]
        NSSupportsLiveActivities: true
        ALTAppGroups: [group.com.example.vinyl]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.vinyl
      MARKETING_VERSION: "0.1"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: Config/Vinyl.entitlements
  LunaraWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Lunara
        ALTAppGroups: [group.com.example.vinyl]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.vinyl.widgets
      MARKETING_VERSION: "0.1"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      SKIP_INSTALL: YES
      CODE_SIGN_ENTITLEMENTS: Config/LunaraWidgets.entitlements
  VinylTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VinylTests]
    dependencies:
      - target: Vinyl
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Vinyl:
    build: { targets: { Vinyl: all } }
    test: { targets: [VinylTests] }
